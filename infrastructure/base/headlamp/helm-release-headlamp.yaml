apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  chart:
    spec:
      chart: headlamp
      sourceRef:
        kind: HelmRepository
        name: headlamp
      version: 0.40.1
  interval: 1m
  install:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: headlamp-values-base
