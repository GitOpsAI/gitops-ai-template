apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: n8n
  namespace: n8n
spec:
  interval: 30m
  chart:
    spec:
      chart: n8n
      version: 2.0.1
      sourceRef:
        kind: HelmRepository
        name: 8gears
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
    - name: ingress-nginx-external
      namespace: ingress-nginx-external
  valuesFrom:
    - kind: ConfigMap
      name: n8n-values-base
