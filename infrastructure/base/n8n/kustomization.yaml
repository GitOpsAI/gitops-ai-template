apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: n8n
namespace: n8n
resources:
  - namespace.yaml
  - helm-repository-8gears.yaml
  - helm-release-n8n.yaml
configMapGenerator:
  - name: n8n-values-base
    files:
      - values.yaml=values.yaml
configurations:
  - ../../../kustomizeconfig.yaml
