stages:
  - lint
  - validate
  - security

variables:
  FLUX_VERSION: "2.8.3"
  KUBECONFORM_VERSION: "0.7.0"
  GITLEAKS_VERSION: "8.30.1"
  # Cluster variables
  CLUSTER_NAME: "ci-test"
  CLUSTER_DOMAIN: "example.com"
  CLUSTER_PUBLIC_IP: "127.0.0.1"
  LETSENCRYPT_EMAIL: "ci@example.com"
  INGRESS_NGINX_ALLOWED_IPS: "0.0.0.0/0"

# ---------------------------------------------------------------------------
# Shared base for validate jobs
# ---------------------------------------------------------------------------

.validate-base:
  stage: validate
  image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
  before_script:
    - apk add --no-cache curl bash gettext
    - |
      curl -sL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" \
        | tar xz -C /usr/local/bin
    - |
      mkdir -p "clusters/${CLUSTER_NAME}"
      cp -r clusters/_template/* "clusters/${CLUSTER_NAME}/"
      envsubst '${CLUSTER_NAME} ${CLUSTER_DOMAIN} ${CLUSTER_PUBLIC_IP} ${LETSENCRYPT_EMAIL} ${INGRESS_NGINX_ALLOWED_IPS}' \
        < "clusters/${CLUSTER_NAME}/cluster-sync.yaml" > "clusters/${CLUSTER_NAME}/cluster-sync.yaml.tmp"
      mv "clusters/${CLUSTER_NAME}/cluster-sync.yaml.tmp" "clusters/${CLUSTER_NAME}/cluster-sync.yaml"

      cat > /tmp/flux-system-ks.yaml <<EOF
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: flux-system
        namespace: flux-system
      spec:
        interval: 10m
        sourceRef:
          kind: GitRepository
          name: flux-system
        path: "./clusters/${CLUSTER_NAME}"
        prune: true
      EOF

# ---------------------------------------------------------------------------
# Stage: lint
# ---------------------------------------------------------------------------

yamllint:
  stage: lint
  image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip3 install --break-system-packages yamllint
  script:
    - yamllint -c .yamllint.yml .
  rules:
    - if: $CI_MERGE_REQUEST_IID

# ---------------------------------------------------------------------------
# Stage: validate
# ---------------------------------------------------------------------------

kubeconform:
  extends: .validate-base
  needs: []
  before_script:
    - !reference [.validate-base, before_script]
    - |
      curl -sL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
        | tar xz -C /usr/local/bin
  script:
    - >-
      flux build kustomization flux-system
      --kustomization-file /tmp/flux-system-ks.yaml
      --path "clusters/${CLUSTER_NAME}/"
      --recursive
      --dry-run
      --local-sources "GitRepository/flux-system/flux-system=."
      | kubeconform
      -strict
      -ignore-missing-schemas
      -summary
      -verbose
      -schema-location default
      -schema-location "https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/{{.NormalizedKubernetesVersion}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
      -schema-location "https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
      -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
  rules:
    - if: $CI_MERGE_REQUEST_IID

# ---------------------------------------------------------------------------
# Stage: security
# ---------------------------------------------------------------------------

gitleaks:
  stage: security
  image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
  before_script:
    - apk add --no-cache curl
    - |
      curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
        | tar xz -C /usr/local/bin
  script:
    - gitleaks detect --source . --no-git --verbose
  rules:
    - if: $CI_MERGE_REQUEST_IID
