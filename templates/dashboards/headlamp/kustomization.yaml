apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: headlamp
namespace: headlamp
resources:
  - namespace.yaml
  - helm-repository-headlamp.yaml
  - helm-release-headlamp.yaml
configMapGenerator:
  - name: headlamp-values-base
    namespace: headlamp
    files:
      - values.yaml=values.yaml
configurations:
  - ../../../kustomizeconfig.yaml
