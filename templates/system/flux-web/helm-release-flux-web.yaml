apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-web
  namespace: flux-system
spec:
  interval: 30m
  releaseName: flux-web
  serviceAccountName: flux-operator
  chartRef:
    kind: OCIRepository
    name: flux-operator-chart
  dependsOn:
    - namespace: envoy-gateway-system
      name: enwoy-gateway
  values:
    fullnameOverride: flux-web
    installCRDs: false
    web:
      serverOnly: true
      # Replaced by network-policy-flux-web.yaml (chart default admits every namespace)
      networkPolicy:
        create: false
      httpRoute:
        enabled: true
        parentRefs:
          - name: public
            namespace: envoy-gateway-system
            sectionName: https
        hostnames:
          - flux.${cluster_domain}
