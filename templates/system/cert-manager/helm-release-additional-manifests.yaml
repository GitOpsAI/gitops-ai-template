apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-additional-manifests
  namespace: cert-manager
spec:
  releaseName: cert-manager-additional-manifests
  chart:
    spec:
      chart: additional-manifests
      sourceRef:
        kind: HelmRepository
        name: additional-manifests
        namespace: flux-system
      version: "0.1.0"
  dependsOn:
    - namespace: cert-manager
      name: cert-manager
  interval: 5m
  install:
    remediation:
      retries: 3
  values:
    manifests:
    # issuer-lets-encrypt-staging.yaml
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-${cluster_name}
      spec:
        acme:
          server: https://acme-v02.api.letsencrypt.org/directory
          email: ${letsencrypt_email}
          privateKeySecretRef:
            name: letsencrypt-${cluster_name}
          solvers:
          - http01:
              ingress:
                serviceType: ClusterIP
                ingressClassName: traefik
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-${cluster_name}-dns
      spec:
        acme:
          server: https://acme-v02.api.letsencrypt.org/directory
          email: ${letsencrypt_email}
          privateKeySecretRef:
            name: letsencrypt-${cluster_name}-dns
          solvers:
          - dns01:
              cloudflare:
                apiTokenSecretRef:
                  name: cloudflare-api-token
                  key: api-token

