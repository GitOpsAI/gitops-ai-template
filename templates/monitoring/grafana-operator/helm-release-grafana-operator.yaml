apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: grafana
spec:
  releaseName: grafana-operator
  chart:
    spec:
      chart: grafana-operator
      sourceRef:
        kind: HelmRepository
        name: grafana-operator
      version: 5.22.2
  interval: 5m
  install:
    remediation:
      retries: 3
  values:
    namespaceScope: true
    enforceCacheLabels: "off"
