# This is helm chart which is used to create a Grafana instance using the Grafana operator
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-instance
  namespace: grafana
spec:
  releaseName: grafana-instance
  chart:
    spec:
      chart: additional-manifests
      sourceRef:
        kind: HelmRepository
        name: additional-manifests
        namespace: flux-system
      version: "0.1.0"
  dependsOn:
    - namespace: envoy-gateway-system
      name: enwoy-gateway
    - namespace: grafana
      name: grafana-operator
  interval: 5m
  install:
    remediation:
      retries: 3
  # Values for the helm chart
  values:
    manifests:
      # Create a Grafana instance
      - apiVersion: grafana.integreatly.org/v1beta1
        kind: Grafana
        metadata:
          name: grafana
          labels:
            dashboards: "grafana"
        spec:
          version: "13.0.1"
          config:
            security:
              admin_user: root
              admin_password: pleaseletmein2026
            log:
              mode: "console"
            auth:
              disable_login_form: "false"
            auth.anonymous:
              enabled: "true"
              org_role: "Editor"
            # Enable Google OAuth
            auth.google:
              enabled: "false"
            auth.basic:
              enabled: "true"
          # Modify the Grafana deployment to use the Google OAuth credentials
          deployment:
            spec:
              template:
                spec:
                  containers:
                    - name: grafana
                      resources:
                        requests:
                          cpu: 50m
                          memory: 128Mi
                        limits:
                          cpu: 2
                          memory: 1024Mi
      # Not spec.httpRoute: grafana-operator only detects the Gateway API CRDs at startup, so on
      # clusters upgraded from ingress-nginx it would ignore the route until restarted.
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: grafana
        spec:
          parentRefs:
            - name: public
              namespace: envoy-gateway-system
              sectionName: https
          hostnames:
            - grafana.${cluster_domain}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
              backendRefs:
                - name: grafana-service
                  port: 3000
