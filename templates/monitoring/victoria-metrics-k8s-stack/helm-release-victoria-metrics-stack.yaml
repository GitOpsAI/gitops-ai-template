apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: victoria-metrics
spec:
  releaseName: supermon
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: victoria-metrics
      version: 0.72.6
  dependsOn:
    - namespace: ingress-nginx-external
      name: ingress-nginx-external
  interval: 5m
  install:
    remediation:
      retries: 5
  values:
    global:
      # -- Cluster label to use for dashboards and rules
      clusterLabel: cluster
      # -- Global license configuration
      license:
        key: ""
        keyRef: {}
        # name: secret-license
        # key: license
      cluster:
        # -- K8s cluster domain suffix, uses for building storage pods' FQDN. Details are [here](https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/)
        dnsDomain: cluster.local.

    # -- Override chart name
    nameOverride: ""
    # -- Resource full name override
    fullnameOverride: ""
    # -- Tenant to use for Grafana datasources and remote write
    tenant: "0"
    # -- If this chart is used in "Argocd" with "releaseName" field then
    # VMServiceScrapes couldn't select the proper services.
    # For correct working need set value 'argocdReleaseOverride=$ARGOCD_APP_NAME'
    argocdReleaseOverride: ""

    # -- VictoriaMetrics Operator dependency chart configuration. More values can be found [here](https://docs.victoriametrics.com/helm/victoria-metrics-operator/#parameters). Also checkout [here](https://docs.victoriametrics.com/operator/configuration/#environment-variables) possible ENV variables to configure operator behaviour
    victoria-metrics-operator:
      enabled: true
      admissionWebhooks:
        enabled: false
      # -- Tells helm to clean up vm cr resources when uninstalling
      cleanupCRD: true
      cleanupImage:
        repository: gcr.io/google_containers/hyperkube
        tag: v1.18.0
        pullPolicy: IfNotPresent

      resources:
        limits:
          cpu: 300m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi

      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        runAsUser: 65534
        runAsGroup: 65534
        capabilities:
          drop:
            - ALL

      crds:
        plain: true
        cleanup:
          enabled: true
          image:
            repository: rancher/kubectl
            pullPolicy: IfNotPresent
        upgrade:
          enabled: true
          forceConflicts: true
      serviceMonitor:
        enabled: true
      operator:
        # -- By default, operator converts prometheus-operator objects.
        disable_prometheus_converter: false
        enable_converter_ownership: true

    defaultDashboards:
      # -- Enable custom dashboards installation
      enabled: false
      defaultTimezone: utc
      labels: {}
      annotations: {}
      grafanaOperator:
        # -- Create dashboards as CRDs (requires grafana-operator to be installed)
        enabled: false
        spec:
          instanceSelector:
            matchLabels:
              dashboards: grafana
          allowCrossNamespaceImport: false
      # -- Create dashboards as ConfigMap despite dependency it requires is not installed
      dashboards:
        victoriametrics-vmalert:
          enabled: true
        victoriametrics-operator:
          enabled: true
        # -- In ArgoCD using client-side apply this dashboard reaches annotations size limit and causes k8s issues without server side apply
        # See [this issue](https://github.com/VictoriaMetrics/helm-charts/tree/master/charts/victoria-metrics-k8s-stack#metadataannotations-too-long-must-have-at-most-262144-bytes-on-dashboards)
        node-exporter-full:
          enabled: true

    # -- Create default rules for monitoring the cluster
    defaultRules:
      # -- Labels, which are used for grouping results of the queries. Note that these labels are joined with `.Values.global.clusterLabel`
      additionalGroupByLabels: []
      create: false

      # -- Common properties for VMRule groups
      group:
        spec:
          # -- Optional HTTP URL parameters added to each rule request
          params: {}

      # -- Common properties for all VMRules
      rule:
        spec:
          # -- Additional labels for all VMRules
          labels: {}
          # -- Additional annotations for all VMRules
          annotations: {}

      # -- Common properties for VMRules alerts
      alerting:
        spec:
          # -- Additional labels for VMRule alerts
          labels: {}
          # -- Additional annotations for VMRule alerts
          annotations: {}

      # -- Common properties for VMRules recording rules
      recording:
        spec:
          # -- Additional labels for VMRule recording rules
          labels: {}
          # -- Additional annotations for VMRule recording rules
          annotations: {}

      # -- Per rule properties
      rules: {}
      # yamllint disable rule:comments-indentation
      # CPUThrottlingHigh:
      #   create: true
      #   spec:
      #     for: 15m
      #     labels:
      #       severity: critical
      # yamllint enable rule:comments-indentation
      # -- Rule group properties
      groups:
        etcd:
          create: true
          # -- Common properties for all rules in a group
          rules: {}
          # spec:
          #   annotations:
          #     dashboard: https://example.com/dashboard/1
          # -- Common properties for all recording rules in a group
          recording: {}
          # spec:
          #   annotations:
          #     dashboard: https://example.com/dashboard/1
          # -- Common properties for all alerting rules in a group
          alerting: {}
          # spec:
          #   annotations:
          #     dashboard: https://example.com/dashboard/1
        general:
          create: true
          rules: {}
        k8sContainerCpuLimits:
          create: true
          rules: {}
        k8sContainerCpuRequests:
          create: true
          rules: {}
        k8sContainerCpuUsageSecondsTotal:
          create: true
          rules: {}
        k8sContainerMemoryLimits:
          create: true
          rules: {}
        k8sContainerMemoryRequests:
          create: true
          rules: {}
        k8sContainerMemoryRss:
          create: true
          rules: {}
        k8sContainerMemoryCache:
          create: true
          rules: {}
        k8sContainerMemoryWorkingSetBytes:
          create: true
          rules: {}
        k8sContainerMemorySwap:
          create: true
          rules: {}
        k8sPodOwner:
          create: true
          rules: {}
        k8sContainerResource:
          create: true
          rules: {}
        kubeApiserver:
          create: true
          rules: {}
        kubeApiserverAvailability:
          create: true
          rules: {}
        kubeApiserverBurnrate:
          create: true
          rules: {}
        kubeApiserverHistogram:
          create: true
          rules: {}
        kubeApiserverSlos:
          create: true
          rules: {}
        kubelet:
          create: true
          rules: {}
        kubePrometheusGeneral:
          create: true
          rules: {}
        kubePrometheusNodeRecording:
          create: true
          rules: {}
        kubernetesApps:
          create: true
          rules: {}
          targetNamespace: ".*"
        kubernetesResources:
          create: true
          rules: {}
        kubernetesStorage:
          create: true
          rules: {}
          targetNamespace: ".*"
        kubernetesSystem:
          create: true
          rules: {}
        kubernetesSystemKubelet:
          create: true
          rules: {}
        kubernetesSystemApiserver:
          create: true
          rules: {}
        kubernetesSystemControllerManager:
          create: true
          rules: {}
        kubeScheduler:
          create: true
          rules: {}
        kubernetesSystemScheduler:
          create: true
          rules: {}
        kubeStateMetrics:
          create: true
          rules: {}
        nodeNetwork:
          create: true
          rules: {}
        node:
          create: true
          rules: {}
        vmagent:
          create: true
          rules: {}
        vmsingle:
          create: true
          rules: {}
        vmcluster:
          create: true
          rules: {}
        vmHealth:
          create: true
          rules: {}
        vmoperator:
          create: true
          rules: {}
        alertmanager:
          create: true
          rules: {}

      # -- Runbook url prefix for default rules
      runbookUrl: https://runbooks.prometheus-operator.dev/runbooks

      # -- Labels for default rules
      labels: {}
      # -- Annotations for default rules
      annotations: {}

    # -- Provide custom recording or alerting rules to be deployed into the cluster.
    extraRules: {}
    #  rule-name:
    #    groups:
    #    - name: my_group
    #      rules:
    #      - record: my_record
    #        expr: 100 * my_record

    # -- deprecated. use extraRules instead
    additionalVictoriaMetricsMap: {}
    #  rule-name:
    #    groups:
    #    - name: my_group
    #      rules:
    #      - record: my_record
    #        expr: 100 * my_record

    external:
      grafana:
        # -- External Grafana host
        host: ""
        # -- External Grafana datasource name
        datasource: VictoriaMetrics
      # -- External VM read and write URLs
      vm:
        read:
          url: ""
          # bearerTokenSecret:
          #   name: dbaas-read-access-token
          #   key: bearerToken
        write:
          url: ""
          # bearerTokenSecret:
          #   name: dbaas-read-access-token
          #   key: bearerToken

    # Configures vmsingle params
    vmsingle:
      # -- VMSingle labels
      labels: {}
      # -- VMSingle annotations
      annotations: {}
      enabled: true
      # -- Full spec for VMSingle CRD. Allowed values describe [here](https://docs.victoriametrics.com/operator/api/#vmsinglespec)
      spec:
        port: "8429"
        # -- Data retention period. Possible units character: h(ours), d(ays), w(eeks), y(ears), if no unit character specified - month. The minimum retention period is 24h. See these [docs](https://docs.victoriametrics.com/victoriametrics/single-server-victoriametrics/#retention)
        retentionPeriod: "14d"
        replicaCount: 1
        extraArgs:
          maxLabelValueLen: "300"
          maxLabelsPerTimeseries: "300"
          search.latencyOffset: "5s"
          search.maxUniqueTimeseries: "100000"
          search.maxQueryDuration: "30s"
          search.maxConcurrentRequests: "16"
          search.maxQueueDuration: "60s"
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          capabilities:
            drop:
              - ALL
      ingress:
        # -- Enable deployment of ingress for server component
        enabled: true
        # -- Ingress annotations
        annotations:
          nginx.ingress.kubernetes.io/whitelist-source-range: "${ingress_nginx_allowed_ips}"
          external-dns.alpha.kubernetes.io/target: "${cluster_public_ip}"
          # kubernetes.io/ingress.class: nginx
          # kubernetes.io/tls-acme: "true"
        # -- Ingress extra labels
        labels: {}
        # -- Ingress default path
        path: ""
        # -- Ingress path type
        pathType: Prefix
        # -- Ingress controller class name
        ingressClassName: nginx-external

        # -- Array of host objects
        hosts:
          - victoria.${cluster_domain}
        # -- Extra paths to prepend to every host configuration. This is useful when working with annotation based services.
        extraPaths: []
        # - path: /*
        #   pathType: Prefix
        #   backend:
        #     service:
        #       name: ssl-redirect
        #       port:
        #         name: service

        # -- Array of TLS objects
        tls:
          - secretName: victoria-${cluster_name}-tls
            hosts:
              - victoria.${cluster_domain}
      route:
        # -- Enable deployment of HTTPRoute for server component
        enabled: false
        # -- HTTPRoute annotations
        annotations: {}
        # -- HTTPRoute extra labels
        labels: {}
        # -- HTTPGateway objects refs
        parentRefs: []
        # -- Array of hostnames
        hostnames: []
        # -- Extra rules to prepend to route. This is useful when working with annotation based services.
        extraRules: []
        # -- Route port
        port: '{{ .Values.vmsingle.spec.port }}'
        # -- Filters for a default rule in HTTPRoute
        filters: []
        # -- Matches for a default rule in HTTPRoute
        matches:
          - path:
              type: PathPrefix
              value: '{{ dig "spec" "extraArgs" "http.pathPrefix" "/" .Values.vmsingle }}'
    vmcluster:
      # -- Create VMCluster CR
      enabled: false
      # -- VMCluster labels
      labels: {}
      # -- VMCluster annotations
      annotations: {}
      # -- Full spec for VMCluster CRD. Allowed values described [here](https://docs.victoriametrics.com/operator/api/#vmclusterspec)
      spec:
        retentionPeriod: "30d"
        replicationFactor: 2
        vmstorage:
          replicaCount: 2
          storageDataPath: /vm-data
          storage:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 10Gi
          resources:
            {}
            # limits:
            #   cpu: "1"
            #   memory: 1500Mi
        vmselect:
          # -- Set this value to false to disable VMSelect
          enabled: true
          port: "8481"
          replicaCount: 2
          cacheMountPath: /select-cache
          extraArgs: {}
          storage:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 2Gi
          resources:
            {}
            # limits:
            #   cpu: "1"
            #   memory: "1000Mi"
            # requests:
            #   cpu: "0.5"
            #   memory: "500Mi"
        vminsert:
          # -- Set this value to false to disable VMInsert
          enabled: true
          port: "8480"
          replicaCount: 2
          extraArgs: {}
          resources:
            {}
            # limits:
            #   cpu: "1"
            #   memory: 1000Mi
            # requests:
            #   cpu: "0.5"
            #   memory: "500Mi"

      ingress:
        storage:
          # -- Enable deployment of ingress for server component
          enabled: false

          # -- Ingress annotations
          annotations: {}
          # kubernetes.io/ingress.class: nginx
          # kubernetes.io/tls-acme: "true"

          # -- Ingress extra labels
          labels: {}

          # -- Ingress controller class name
          ingressClassName: ""

          # -- Ingress path type
          pathType: Prefix

          # -- Ingress default path
          path: ""

          # -- Array of host objects
          hosts: []
          #  - vmstorage.domain.com

          # -- Extra paths to prepend to every host configuration. This is useful when working with annotation based services.
          extraPaths: []
          # - path: /*
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: ssl-redirect
          #       port:
          #         name: service

          # -- Array of TLS objects
          tls: []
          #  - secretName: vmstorage-ingress-tls
          #    hosts:
          #      - vmstorage.domain.com
        select:
          # -- Enable deployment of ingress for server component
          enabled: false

          # -- Ingress annotations
          annotations: {}
          # kubernetes.io/ingress.class: nginx
          # kubernetes.io/tls-acme: "true"

          # -- Ingress extra labels
          labels: {}

          # -- Ingress controller class name
          ingressClassName: ""

          # -- Ingress path type
          pathType: Prefix

          # -- Ingress default path
          path: '{{ dig "extraArgs" "http.pathPrefix" "/" .Values.vmcluster.spec.vmselect }}'

          # -- Array of host objects
          hosts: []
          #  - vmselect.domain.com
          # -- Extra paths to prepend to every host configuration. This is useful when working with annotation based services.
          extraPaths: []
          # - path: /*
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: ssl-redirect
          #       port:
          #         name: service

          # -- Array of TLS objects
          tls: []
          #  - secretName: vmselect-ingress-tls
          #    hosts:
          #      - vmselect.domain.com
        insert:
          # -- Enable deployment of ingress for server component
          enabled: false

          # -- Ingress annotations
          annotations:
            {}
            # kubernetes.io/ingress.class: nginx
            # kubernetes.io/tls-acme: "true"

          # -- Ingress extra labels
          labels: {}

          # -- Ingress controller class name
          ingressClassName: ""

          # -- Ingress path type
          pathType: Prefix

          # -- Ingress default path
          path: '{{ dig "extraArgs" "http.pathPrefix" "/" .Values.vmcluster.spec.vminsert }}'

          # -- Array of host objects
          hosts: []
          #  - vminsert.domain.com
          # -- Extra paths to prepend to every host configuration. This is useful when working with annotation based services.
          extraPaths: []
          # - path: /*
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: ssl-redirect
          #       port:
          #         name: service

          # -- Array of TLS objects
          tls: []
          #  - secretName: vminsert-ingress-tls
          #    hosts:
          #      - vminsert.domain.com
      route:
        storage:
          # -- Enable deployment of HTTPRoute for storage component
          enabled: false
          # -- HTTPRoute annotations
          annotations: {}
          # -- HTTPRoute extra labels
          labels: {}
          # -- HTTPGateway objects refs
          parentRefs: []
          # -- Array of hostnames
          hostnames: []
          # -- Extra rules to prepend to route. This is useful when working with annotation based services.
          extraRules: []
          # -- Route port
          port: '{{ .Values.vmcluster.spec.vmstorage.port }}'
          # -- Filters for a default rule in HTTPRoute
          filters: []
          # -- Matches for a default rule in HTTPRoute
          matches:
            - path:
                type: PathPrefix
                value: '{{ dig "extraArgs" "http.pathPrefix" "/" .Values.vmcluster.spec.vmstorage }}'
        select:
          # -- Enable deployment of HTTPRoute for select component
          enabled: false
          # -- HTTPRoute annotations
          annotations: {}
          # -- HTTPRoute extra labels
          labels: {}
          # -- HTTPGateway objects refs
          parentRefs: []
          # -- Array of hostnames
          hostnames: []
          # -- Extra rules to prepend to route. This is useful when working with annotation based services.
          extraRules: []
          # -- Route port
          port: '{{ .Values.vmcluster.spec.vmselect.port }}'
          # -- Filters for a default rule in HTTPRoute
          filters: []
          # -- Matches for a default rule in HTTPRoute
          matches:
            - path:
                type: PathPrefix
                value: '{{ dig "extraArgs" "http.pathPrefix" "/" .Values.vmcluster.spec.vmselect }}'
        insert:
          # -- Enable deployment of HTTPRoute for insert component
          enabled: false
          # -- HTTPRoute annotations
          annotations: {}
          # -- HTTPRoute extra labels
          labels: {}
          # -- HTTPGateway objects refs
          parentRefs: []
          # -- Array of hostnames
          hostnames: []
          # -- Extra rules to prepend to route. This is useful when working with annotation based services.
          extraRules: []
          # -- Route port
          port: '{{ .Values.vmcluster.spec.vminsert.port }}'
          # -- Filters for a default rule in HTTPRoute
          filters: []
          # -- Matches for a default rule in HTTPRoute
          matches:
            - path:
                type: PathPrefix
                value: '{{ dig "extraArgs" "http.pathPrefix" "/" .Values.vmcluster.spec.vminsert }}'

    alertmanager:
      # -- Create VMAlertmanager CR
      enabled: true
      # -- VMAlertmanager labels
      labels: {}
      # -- VMAlertmanager annotations
      annotations: {}
      # -- (object) Full spec for VMAlertmanager CRD. Allowed values described [here](https://docs.victoriametrics.com/operator/api/#vmalertmanagerspec)
      spec:
        replicaCount: 1
        port: "9093"
        selectAllByDefault: true
        image:
          tag: v0.28.1
        externalURL: https://am.${cluster_domain}
        routePrefix: /
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
        storage:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 1Gi
        containers:
          - name: alertmanager
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          - name: config-reloader
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL


        # -- (string) If this one defined, it will be used for alertmanager configuration and config parameter will be ignored
        configSecret: ""
      # --
      # @raw
      # enable storing .Values.alertmanager.config in VMAlertmanagerConfig instead of k8s Secret.
      # Note: VMAlertmanagerConfig and plain VMAlertmanager config structures are not equal.
      # If you're migrating existing config, please make sure that `.Values.alertmanager.config`:
      # - with `useManagedConfig: false` has structure described [here](https://prometheus.io/docs/alerting/latest/configuration/).
      # - with `useManagedConfig: true` has structure described [here](https://docs.victoriametrics.com/operator/api/#vmalertmanagerconfig).
      useManagedConfig: false
      # -- (object) VMAlertmanager configuration

      # if this one defined, it will be used for alertmanager configuration and config parameter will be ignored
      # configSecret: "alertmanager-config"
      persistentVolume:
        enabled: true
        size: 1Gi


      config:
        templates:
          - "/etc/vm/configs/**/*.tmpl"
        inhibit_rules: []

      # better alert templates for slack
      # source https://gist.github.com/milesbxf/e2744fc90e9c41b47aa47925f8ff6512
      monzoTemplate:
        enabled: false

      # extra alert templates
      templateFiles:
        notifications.tmpl: |-
          {{/* Color of Slack attachment (appears as line next to alert )*/}}
          {{ define "slack.color" -}}
              {{ if eq .Status "firing" -}}
                  {{ if eq .CommonLabels.severity "critical" -}}
                      #940000
                  {{- else if eq .CommonLabels.severity "high" -}}
                      danger
                  {{- else if eq .CommonLabels.severity "warning" -}}
                      warning
                  {{- else if eq .CommonLabels.severity "info" -}}
                      #439FE0
                  {{- else -}}
                      #BCBCBC
                  {{- end -}}
              {{ else -}}
              good
              {{- end }}
          {{- end }}

          {{ define "__alert_silence_link" -}}
            {{ .ExternalURL }}/#/silences/new?filter=%7B
            {{- range .CommonLabels.SortedPairs -}}
                {{- if ne .Name "alertname" -}}
                    {{- .Name }}%3D"{{- .Value -}}"%2C%20
                {{- end -}}
            {{- end -}}
            alertname%3D"{{- .CommonLabels.alertname -}}"%7D
          {{- end }}

          {{ define "__single_message_title" }}{{ range .Alerts.Firing }}{{ .Labels.alertname }}{{ end }}{{ range .Alerts.Resolved }}{{ .Labels.alertname }}{{ end }}{{ end }}

          {{ define "custom_title" }}[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ if or (and (eq (len .Alerts.Firing) 1) (eq (len .Alerts.Resolved) 0)) (and (eq (len .Alerts.Firing) 0) (eq (len .Alerts.Resolved) 1)) }}{{ template "__single_message_title" . }}{{ end }}{{ end }}

          {{ define "custom_slack_message" }}
          {{ if or (and (eq (len .Alerts.Firing) 1) (eq (len .Alerts.Resolved) 0)) (and (eq (len .Alerts.Firing) 0) (eq (len .Alerts.Resolved) 1)) }}
          {{ range .Alerts.Firing }}{{ .Annotations.message }}{{ .Annotations.description }}{{ end }}{{ range .Alerts.Resolved }}{{ .Annotations.message }}{{ .Annotations.description }}{{ end }}
          {{ else }}
          {{ if gt (len .Alerts.Firing) 0 }}
          *Alerts Firing:*
          {{ range .Alerts.Firing }}- *{{ .Labels.alertname }}* {{ .Annotations.message }}{{ .Annotations.description }}
          {{ end }}{{ end }}
          {{ if gt (len .Alerts.Resolved) 0 }}
          *Alerts Resolved:*
          {{ range .Alerts.Resolved }}- *{{ .Labels.alertname }}* {{ .Annotations.message }}{{ .Annotations.description }}
          {{ end }}{{ end }}
          {{ end }}
          {{ end }}

      ingress:
        enabled: false
        # For Kubernetes >= 1.18 you should specify the ingress-controller via the field ingressClassName
        # See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#specifying-the-class-of-an-ingress
        # ingressClassName: nginx
        # Values can be templated
        annotations:
          {}
          # kubernetes.io/ingress.class: nginx
          # kubernetes.io/tls-acme: "true"
        labels: {}
        path: '{{ .Values.alertmanager.spec.routePrefix | default "/" }}'
        pathType: Prefix

        hosts:
          - alertmanager.domain.com
        # -- Extra paths to prepend to every host configuration. This is useful when working with annotation based services.
        extraPaths: []
        # - path: /*
        #   pathType: Prefix
        #   backend:
        #     service:
        #       name: ssl-redirect
        #       port:
        #         name: service
        tls: []
        #  - secretName: alertmanager-ingress-tls
        #    hosts:
        #      - alertmanager.domain.com

      # -- (object) VMAlertmanager route configuration
      route:
        # -- Enable deployment of HTTPRoute for alertmanager component
        enabled: false
        # -- HTTPRoute annotations
        annotations: {}
        # -- HTTPRoute extra labels
        labels: {}
        # -- HTTPGateway objects refs
        parentRefs: []
        # -- Array of hostnames
        hostnames: []
        # -- Extra rules to prepend to route. This is useful when working with annotation based services.
        extraRules: []
        # -- Route port
        port: '{{ .Values.alertmanager.spec.port }}'
        # -- Filters for a default rule in HTTPRoute
        filters: []
        # -- Matches for a default rule in HTTPRoute
        matches:
          - path:
              type: PathPrefix
              value: '{{ .Values.alertmanager.spec.routePrefix | default "/" }}'

    vmalert:
      # -- VMAlert annotations
      annotations: {}
      # -- VMAlert labels
      labels: {}
      # -- Create VMAlert CR
      enabled: true

      # -- Controls whether VMAlert should use VMAgent or VMInsert as a target for remotewrite
      remoteWriteVMAgent: true
      # -- (object) Full spec for VMAlert CRD. Allowed values described [here](https://docs.victoriametrics.com/operator/api/#vmalertspec)
      spec:
        selectAllByDefault: true
        evaluationInterval: 20s
        extraArgs:
          http.pathPrefix: "/"

        # External labels to add to all generated recording rules and alerts
        externalLabels: {}
        containers:
          - name: vmalert
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              runAsUser: 65534
              runAsGroup: 65534
              fsGroup: 65534
              capabilities:
                drop:
                  - ALL
          - name: config-reloader
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              runAsUser: 65534
              runAsGroup: 65534
              fsGroup: 65534
              capabilities:
                drop:
                  - ALL

      # -- (object) Extra VMAlert annotation templates
      templateFiles:
        {}
        # template_1.tmpl: |-
        #   {{ define "hello" -}}
        #   hello, Victoria!
        #   {{- end }}
        # template_2.tmpl: ""

      # -- Allows to configure static notifiers, discover notifiers via Consul and DNS,
      # see specification [here](https://docs.victoriametrics.com/victoriametrics/vmalert/#notifier-configuration-file).
      # This configuration will be created as separate secret and mounted to VMAlert pod.
      additionalNotifierConfigs: {}
      # dns_sd_configs:
      #   - names:
      #       - my.domain.com
      #     type: 'A'
      #     port: 9093
      # -- (object) VMAlert ingress config
      ingress:
        enabled: true
        # For Kubernetes >= 1.18 you should specify the ingress-controller via the field ingressClassName
        # See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#specifying-the-class-of-an-ingress
        ingressClassName: nginx-external
        # Values can be templated
        annotations:
          nginx.ingress.kubernetes.io/whitelist-source-range: "${ingress_nginx_allowed_ips}"
          external-dns.alpha.kubernetes.io/target: "${cluster_public_ip}"
          # kubernetes.io/ingress.class: nginx
          # kubernetes.io/tls-acme: "true"
        labels: {}
        path: ""
        pathType: Prefix

        hosts:
          - victoria-alerts.${cluster_domain}
        # -- Extra paths to prepend to every host configuration. This is useful when working with annotation based services.
        extraPaths: []
        # - path: /*
        #   pathType: Prefix
        #   backend:
        #     service:
        #       name: ssl-redirect
        #       port:
        #         name: service
        tls:
          - secretName: victoria-${cluster_name}-tls
            hosts:
              - victoria-alerts.${cluster_domain}

      # -- (object) VMAlert route configuration
      route:
        # -- Enable deployment of HTTPRoute for vmalert component
        enabled: false
        # -- HTTPRoute annotations
        annotations: {}
        # -- HTTPRoute extra labels
        labels: {}
        # -- HTTPGateway objects refs
        parentRefs: []
        # -- Array of hostnames
        hostnames: []
        # -- Extra rules to prepend to route. This is useful when working with annotation based services.
        extraRules: []
        # -- Route port
        port: '{{ .Values.vmalert.spec.port }}'
        # -- Filters for a default rule in HTTPRoute
        filters: []
        # -- Matches for a default rule in HTTPRoute
        matches:
          - path:
              type: PathPrefix
              value: '{{ dig "spec" "extraArgs" "http.pathPrefix" "/" .Values.vmalert }}'

    vmauth:
      # -- Enable VMAuth CR
      enabled: false
      # -- VMAuth labels
      labels: {}
      # -- VMAuth annotations
      annotations: {}
      # -- (object) Full spec for VMAuth CRD. Allowed values described [here](https://docs.victoriametrics.com/operator/api/#vmauthspec)
      # It's possible to use given below predefined variables in spec:
      # * `{{ .vm.read }}` - parsed vmselect, vmsingle or external.vm.read URL
      # * `{{ .vm.write }}` - parsed vminsert, vmsingle or external.vm.write URL
      spec:
        port: "8427"
        unauthorizedUserAccessSpec:
          # -- Flag, that allows to disable default VMAuth unauthorized user access config
          disabled: false
          discover_backend_ips: true
          url_map:
            - src_paths:
                - '{{ .vm.read.path }}/.*'
              url_prefix:
                - '{{ urlJoin (omit .vm.read "path") }}/'
            - src_paths:
                - '{{ .vm.write.path }}/.*'
              url_prefix:
                - '{{ urlJoin (omit .vm.write "path") }}/'

    vmagent:
      # -- Create VMAgent CR
      enabled: true
      # -- VMAgent labels
      labels: {}
      # -- VMAgent annotations
      annotations: {}
      rbac:
        # -- Role/RoleBinding annotations
        annotations: {}
        # -- Defines if ClusterRole or Role with respective bindings should be created
        namespaced: true
        # -- Role/RoleBinding labels
        extraLabels: {}
        # -- additional rules for a role
        rules: []
      # -- Remote write configuration of VMAgent, allowed parameters defined in a [spec](https://docs.victoriametrics.com/operator/api/#vmagentremotewritespec)
      additionalRemoteWrites:
        []
        # - url: http://some-remote-write/api/v1/write
      # -- (object) Full spec for VMAgent CRD. Allowed values described [here](https://docs.victoriametrics.com/operator/api/#vmagentspec)
      spec:
        port: "8429"
        selectAllByDefault: true
        scrapeInterval: 20s
        extraArgs:
          promscrape.streamParse: "true"
          # Do not store original labels in vmagent's memory by default. This reduces the amount of memory used by vmagent
          # but makes vmagent debugging UI less informative. See: https://docs.victoriametrics.com/victoriametrics/relabeling/#relabel-debugging
          promscrape.dropOriginalLabels: "true"
          promscrape.maxScrapeSize: "134217728"
        containers:
          - name: vmagent
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              runAsUser: 65534
              runAsGroup: 65534
              fsGroup: 65534
              capabilities:
                drop:
                  - ALL
          - name: config-reloader
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              runAsUser: 65534
              runAsGroup: 65534
              fsGroup: 65534
              capabilities:
                drop:
                  - ALL
      # -- (object) VMAgent ingress configuration
      ingress:
        enabled: true
        # For Kubernetes >= 1.18 you should specify the ingress-controller via the field ingressClassName
        # See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#specifying-the-class-of-an-ingress
        ingressClassName: nginx-external
        # Values can be templated
        annotations:
          nginx.ingress.kubernetes.io/whitelist-source-range: "${ingress_nginx_allowed_ips}"
          external-dns.alpha.kubernetes.io/target: "${cluster_public_ip}"
          # kubernetes.io/ingress.class: nginx
          # kubernetes.io/tls-acme: "true"
        labels: {}
        path: ""
        pathType: Prefix

        hosts:
          - victoria-agent.${cluster_domain}
        extraPaths: []
        # - path: /*
        #   pathType: Prefix
        #   backend:
        #     service:
        #       name: ssl-redirect
        #       port:
        #         name: service
        tls:
          - secretName: victoria-agent-${cluster_name}-tls
            hosts:
              - victoria-agent.${cluster_domain}

      # -- (object) VMAgent route configuration
      route:
        # -- Enable deployment of HTTPRoute for vmagent component
        enabled: false
        # -- HTTPRoute annotations
        annotations: {}
        # -- HTTPRoute extra labels
        labels: {}
        # -- HTTPGateway objects refs
        parentRefs: []
        # -- Array of hostnames
        hostnames: []
        # -- Extra rules to prepend to route. This is useful when working with annotation based services.
        extraRules: []
        # -- Route port
        port: '{{ .Values.vmagent.spec.port }}'
        # -- Filters for a default rule in HTTPRoute
        filters: []
        # -- Matches for a default rule in HTTPRoute
        matches:
          - path:
              type: PathPrefix
              value: '{{ dig "spec" "extraArgs" "http.pathPrefix" "/" .Values.vmagent }}'

    defaultDatasources:
      grafanaOperator:
        # -- Create datasources as CRDs (requires grafana-operator to be installed)
        enabled: false
        annotations: {}
        spec:
          instanceSelector:
            matchLabels:
              dashboards: grafana
          allowCrossNamespaceImport: false
      victoriametrics:
        # -- List of prometheus compatible datasource configurations.
        # VM `url` will be added to each of them in templates.
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            access: proxy
            isDefault: true
          - name: VictoriaMetrics (DS)
            isDefault: false
            access: proxy
            type: victoriametrics-metrics-datasource
      # -- List of alertmanager datasources.
      # VMAlertmanager generated `url` will be added to each datasource in template if alertmanager is enabled
      alertmanager:
        datasources:
          - name: Alertmanager
            access: proxy
            jsonData:
              implementation: prometheus
      # -- Configure additional grafana datasources (passed through tpl).
      # Check [here](http://docs.grafana.org/administration/provisioning/#datasources) for details
      extra: []
      # yamllint disable rule:comments-indentation
      # - name: prometheus-sample
      #   access: proxy
      #   basicAuth: true
      #   basicAuthPassword: pass
      #   basicAuthUser: daco
      #   editable: false
      #   jsonData:
      #     tlsSkipVerify: true
      #   orgId: 1
      #   type: prometheus
      #   url: https://{{ printf "%s-prometheus.svc" .Release.Name }}:9090
      #   version: 1
      # yamllint enable rule:comments-indentation

    # -- Grafana dependency chart configuration. For possible values refer [here](https://github.com/grafana/helm-charts/tree/main/charts/grafana#configuration)
    grafana:
      enabled: false
      # all values for grafana helm chart can be specified here
      sidecar:
        datasources:
          enabled: true
          label: grafana_datasource
          labelValue: "1"
        dashboards:
          provider:
            name: default
            orgid: 1
          folder: /var/lib/grafana/dashboards
          defaultFolderName: default
          enabled: true
          multicluster: false
          label: grafana_dashboard
          labelValue: "1"

      # -- Create datasource configmap even if grafana deployment has been disabled
      forceDeployDatasource: false

      # Uncomment the block below, if you want to enable VictoriaMetrics Datasource in Grafana:
      # Note that Grafana will need internet access to install the datasource plugin.
      #
      # plugins:
      # - victoriametrics-metrics-datasource
      # - victoriametrics-logs-datasource

      ingress:
        enabled: false
        # For Kubernetes >= 1.18 you should specify the ingress-controller via the field ingressClassName
        # See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#specifying-the-class-of-an-ingress
        # ingressClassName: nginx
        # Values can be templated
        annotations:
          {}
          # kubernetes.io/ingress.class: nginx
          # kubernetes.io/tls-acme: "true"
        labels: {}
        path: /
        pathType: Prefix

        hosts:
          - grafana.domain.com
        # -- Extra paths to prepend to every host configuration. This is useful when working with annotation based services.
        extraPaths: []
        # - path: /*
        #   pathType: Prefix
        #   backend:
        #     service:
        #       name: ssl-redirect
        #       port:
        #         name: service
        tls: []
        #  - secretName: grafana-ingress-tls
        #    hosts:
        #      - grafana.domain.com

      # -- Grafana VM scrape config
      vmScrape:
        # whether we should create a service scrape resource for grafana
        enabled: true

        # -- [Scrape configuration](https://docs.victoriametrics.com/operator/api/#vmservicescrapespec) for Grafana
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: '{{ include "grafana.name" .Subcharts.grafana }}'
          endpoints:
            - port: '{{ .Values.grafana.service.portName }}'

    defaultScrapeService:
      namespace: kube-system

    # -- prometheus-node-exporter dependency chart configuration. For possible values check [here](https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus-node-exporter/values.yaml)
    prometheus-node-exporter:
      enabled: true

      # all values for prometheus-node-exporter helm chart can be specified here
      service:
        # Add the 'node-exporter' label to be used by serviceMonitor to match standard common usage in rules and grafana dashboards
        #
        labels:
          jobLabel: node-exporter
      extraArgs:
        - --collector.filesystem.ignored-mount-points=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        - --collector.filesystem.ignored-fs-types=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|tmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
        - --collector.ethtool
      # -- Node Exporter VM scrape config
      vmScrape:
        # whether we should create a service scrape resource for node-exporter
        enabled: true

        # -- [Scrape configuration](https://docs.victoriametrics.com/operator/api/#vmservicescrapespec) for Node Exporter
        spec:
          jobLabel: jobLabel
          selector:
            matchLabels:
              app.kubernetes.io/name: '{{ include "prometheus-node-exporter.name" (index .Subcharts "prometheus-node-exporter") }}'
          endpoints:
            - port: metrics
              metricRelabelConfigs:
                - action: drop
                  source_labels: [mountpoint]
                  regex: "/var/lib/kubelet/pods.+"
              relabelConfigs:
                - action: replace
                  sourceLabels: [__meta_kubernetes_endpoint_node_name]
                  separator: ;
                  regex: ^(.*)$
                  targetLabel: instance
                  replacement: $1

      containerSecurityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        privileged: false

      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 1
          memory: 256Mi

      networkPolicy:
        enabled: true

    # -- kube-state-metrics dependency chart configuration. For possible values check [here](https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-state-metrics/values.yaml)
    kube-state-metrics:
      enabled: true
      ## all values for kube-state-metrics helm chart can be specified here
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - notification.toolkit.fluxcd.io
              - image.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - buckets
              - helmrepositories
              - helmcharts
              - ocirepositories
              - kustomizations
              - helmreleases
              - alerts
              - providers
              - receivers
              - imagerepositories
              - imagepolicies
              - imageupdateautomations
            verbs: ["list", "watch"]
      # -- [Scrape configuration](https://docs.victoriametrics.com/operator/api/#vmservicescrapespec) for Kube State Metrics
      vmScrape:
        enabled: true
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: '{{ include "kube-state-metrics.name" (index .Subcharts "kube-state-metrics") }}'
              app.kubernetes.io/instance: '{{ include "vm.release" . }}'
          endpoints:
            - port: http
              honorLabels: true
              metricRelabelConfigs:
                - action: labeldrop
                  regex: (uid|container_id|image_id)
          jobLabel: app.kubernetes.io/name
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
                      source_name: [spec, sourceRef, name]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, history, "0", chartVersion]
                      chart_name: [status, history, "0", chartName]
                      chart_app_version: [status, history, "0", appVersion]
                      chart_ref_name: [spec, chartRef, name]
                      chart_source_name: [spec, chart, spec, sourceRef, name]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux GitRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1beta2
                  kind: Bucket
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Bucket resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      endpoint: [spec, endpoint]
                      bucket_name: [spec, bucketName]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmChart resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      chart_name: [spec, chart]
                      chart_version: [spec, version]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1beta2
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux OCIRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Alert
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Alert resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Provider
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Provider resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1
                  kind: Receiver
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Receiver resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      webhook_path: [status, webhookPath]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1beta2
                  kind: ImageRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImageRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      image: [spec, image]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1beta2
                  kind: ImagePolicy
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImagePolicy resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      source_name: [spec, imageRepositoryRef, name]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1beta2
                  kind: ImageUpdateAutomation
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImageUpdateAutomation resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      source_name: [spec, sourceRef, name]

      resources:
        limits:
          cpu: 2
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi

      networkPolicy:
        enabled: true
        ingress:
          - from:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: vmagent
        egress:
          - to:
              - ipBlock:
                  cidr: 192.168.1.0/24

      containerSecurityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

      releaseLabel: true
      metricLabelsAllowlist:
        - nodes=[kubernetes.io/hostname,node.kubernetes.io/role]

      # spec for VMServiceScrape crd
      # https://docs.victoriametrics.com/operator/api.html#vmservicescrapespec
      vmServiceScrape:
        spec: {}


    # -- Component scraping the kubelets
    kubelet:
      enabled: true
      vmScrapes:
        # -- Enable scraping /metrics/cadvisor from kubelet's service
        cadvisor:
          enabled: true
          spec:
            path: /metrics/cadvisor
        # -- Enable scraping /metrics/probes from kubelet's service
        probes:
          enabled: true
          spec:
            path: /metrics/probes
        # -- Enabled scraping /metrics/resource from kubelet's service
        resources:
          enabled: true
          spec:
            path: /metrics/resource
        kubelet:
          spec: {}
      # -- Spec for VMNodeScrape CRD is [here](https://docs.victoriametrics.com/operator/api/#vmnodescrapespec)
      vmScrape:
        kind: VMNodeScrape
        spec:
          scheme: "https"
          honorLabels: true
          interval: "30s"
          scrapeTimeout: "5s"
          tlsConfig:
            insecureSkipVerify: true
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          # drop high cardinality label and useless metrics for cadvisor and kubelet
          metricRelabelConfigs:
            - action: labeldrop
              regex: (uid)
            - action: labeldrop
              regex: (id|name)
            - action: drop
              source_labels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
            # Drop high-cardinality cAdvisor metrics with poor signal/noise ratio
            # container_tasks_state: rarely used in alerts/dashboards
            # container_memory_failures_total: pgfault counts rarely actioned
            - action: drop
              source_labels: [__name__]
              regex: "container_tasks_state|container_memory_failures_total"
          relabelConfigs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
            - targetLabel: job
              replacement: kubelet
          # ignore timestamps of cadvisor's metrics by default
          # more info here https://github.com/VictoriaMetrics/VictoriaMetrics/issues/4697#issuecomment-1656540535
          honorTimestamps: false
    # Component scraping the kube api server
    kubeApiServer:
      # -- Enable Kube Api Server metrics scraping
      enabled: true
      # -- Spec for VMServiceScrape CRD is [here](https://docs.victoriametrics.com/operator/api/#vmservicescrapespec)
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              # bearerTokenSecret:
              #   key: ""
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
                insecureSkipVerify: true
          jobLabel: component
          namespaceSelector:
            matchNames:
              - default
          selector:
            matchLabels:
              component: apiserver
              provider: kubernetes

    # Component scraping the kube controller manager
    kubeControllerManager:
      # -- Enable kube controller manager metrics scraping
      enabled: false

      # -- If your kube controller manager is not deployed as a pod, specify IPs it can be found on
      endpoints: []
      # - 10.141.4.22
      # - 10.141.4.23
      # - 10.141.4.24

      # If using kubeControllerManager.endpoints only the port and targetPort are used
      service:
        # -- Create service for kube controller manager metrics scraping
        enabled: true
        # -- Kube controller manager service port
        port: 10257
        # -- Kube controller manager service target port
        targetPort: 10257
        # -- Kube controller manager service labels
        labels: {}
        # -- Kube controller manager service pod selector
        selector:
          component: kube-controller-manager

      # -- Spec for VMServiceScrape CRD is [here](https://docs.victoriametrics.com/operator/api/#vmservicescrapespec)
      vmScrape:
        spec:
          jobLabel: jobLabel
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              # bearerTokenSecret:
              #   key: ""
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes

    # Component scraping kubeDns. Use either this or coreDns
    kubeDns:
      # -- Enabled KubeDNS metrics scraping
      enabled: false
      service:
        # -- Create Service for KubeDNS metrics
        enabled: false
        # -- KubeDNS service labels
        labels: {}
        # -- KubeDNS service ports
        ports:
          dnsmasq:
            port: 10054
            targetPort: 10054
          skydns:
            port: 10055
            targetPort: 10055
        # -- KubeDNS service pods selector
        selector:
          k8s-app: kube-dns
      # -- Spec for VMServiceScrape CRD is [here](https://docs.victoriametrics.com/operator/api/#vmservicescrapespec)
      vmScrape:
        spec:
          jobLabel: jobLabel
          namespaceSelector:
            matchNames: []
          endpoints:
            - port: http-metrics-dnsmasq
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            - port: http-metrics-skydns
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token

    # Component scraping coreDns. Use either this or kubeDns
    coreDns:
      # -- Enabled CoreDNS metrics scraping
      enabled: true
      service:
        # -- Create service for CoreDNS metrics
        enabled: true
        # -- CoreDNS service port
        port: 9153
        # -- CoreDNS service target port
        targetPort: 9153
        # -- CoreDNS service labels
        labels: {}
        # -- CoreDNS service pod selector
        selector:
          k8s-app: kube-dns

      # -- Spec for VMServiceScrape CRD is [here](https://docs.victoriametrics.com/operator/api/#vmservicescrapespec)
      vmScrape:
        spec:
          jobLabel: jobLabel
          namespaceSelector:
            matchNames: []
          endpoints:
            - port: http-metrics
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token

    # Component scraping etcd
    kubeEtcd:
      # -- Enabled KubeETCD metrics scraping
      enabled: false

      # -- If your etcd is not deployed as a pod, specify IPs it can be found on
      endpoints: []
      # - 10.141.4.22
      # - 10.141.4.23
      # - 10.141.4.24

      # Etcd service. If using kubeEtcd.endpoints only the port and targetPort are used
      service:
        # -- Enable service for ETCD metrics scraping
        enabled: true
        # -- ETCD service port
        port: 2379
        # -- ETCD service target port
        targetPort: 2379
        # -- ETCD service labels
        labels: {}
        # -- ETCD service pods selector
        selector:
          component: etcd

      # -- Spec for VMServiceScrape CRD is [here](https://docs.victoriametrics.com/operator/api/#vmservicescrapespec)
      vmScrape:
        spec:
          jobLabel: jobLabel
          namespaceSelector:
            matchNames: []
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              # bearerTokenSecret:
              #   key: ""
              port: http-metrics
              scheme: https
              tlsConfig:
                # kubectl create secret generic etcd-ca --from-file=server.crt --from-file=server.key -n victoria-metrics
                cert:
                  secret:
                    name: "etcd-ca"
                    key: "server.crt"
                keySecret:
                  name: "etcd-ca"
                  key: "server.key"
                insecureSkipVerify: true

    # Component scraping kube scheduler
    kubeScheduler:
      # -- Enable KubeScheduler metrics scraping
      enabled: false

      # -- If your kube scheduler is not deployed as a pod, specify IPs it can be found on
      endpoints: []
      # - 10.141.4.22
      # - 10.141.4.23
      # - 10.141.4.24

      # If using kubeScheduler.endpoints only the port and targetPort are used
      service:
        # -- Enable service for KubeScheduler metrics scrape
        enabled: true
        # -- KubeScheduler service port
        port: 10259
        # -- KubeScheduler service target port
        targetPort: 10259
        # -- KubeScheduler service labels
        labels: {}
        # -- KubeScheduler service pod selector
        selector:
          component: kube-scheduler

      # -- Spec for VMServiceScrape CRD is [here](https://docs.victoriametrics.com/operator/api/#vmservicescrapespec)
      vmScrape:
        spec:
          jobLabel: jobLabel
          namespaceSelector:
            matchNames: []
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              # bearerTokenSecret:
              #   key: ""
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecureSkipVerify: true

    # Component scraping kube proxy
    kubeProxy:
      # -- Enable kube proxy metrics scraping
      enabled: false

      # -- If your kube proxy is not deployed as a pod, specify IPs it can be found on
      endpoints: []
      # - 10.141.4.22
      # - 10.141.4.23
      # - 10.141.4.24

      service:
        # -- Enable service for kube proxy metrics scraping
        enabled: true
        # -- Kube proxy service port
        port: 10249
        # -- Kube proxy service target port
        targetPort: 10249
        # -- Kube proxy service labels
        labels: {}
        # -- Kube proxy service pod selector
        selector:
          k8s-app: kube-proxy

      # -- Spec for VMServiceScrape CRD is [here](https://docs.victoriametrics.com/operator/api/#vmservicescrapespec)
      vmScrape:
        spec:
          jobLabel: jobLabel
          namespaceSelector:
            matchNames: []
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              # bearerTokenSecret:
              #   key: ""
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

    # -- Add extra objects dynamically to this chart
    extraObjects: []
