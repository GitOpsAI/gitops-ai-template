# ---------------------------------------------------------------------------
# CI pipeline – mirrors .gitlab-ci.yml
# Stages: lint → validate → integration (template upgrade) → security
# Runs on every pull_request targeting main.
# ---------------------------------------------------------------------------

name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: sh

env:
  FLUX_VERSION: "2.8.3"
  KUBECONFORM_VERSION: "0.7.0"
  GITLEAKS_VERSION: "8.30.1"
  # Cluster variables used for template rendering during validate
  CLUSTER_NAME: "ci-test"
  CLUSTER_DOMAIN: "example.com"
  CLUSTER_PUBLIC_IP: "127.0.0.1"
  LETSENCRYPT_EMAIL: "ci@example.com"
  INGRESS_NGINX_ALLOWED_IPS: "0.0.0.0/0"

jobs:
  # ---------------------------------------------------------------------------
  # Stage: lint
  # ---------------------------------------------------------------------------

  yamllint:
    name: Lint – yamllint
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: apk add --no-cache python3 py3-pip && pip3 install --break-system-packages yamllint
      - name: Run yamllint
        run: yamllint -c .yamllint.yml .

  # ---------------------------------------------------------------------------
  # Stage: validate
  # ---------------------------------------------------------------------------

  kubeconform:
    name: Validate – kubeconform
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (flux + kubeconform + gettext)
        run: |
          apk add --no-cache curl bash gettext

          curl -sL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin

          curl -sL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin

      - name: Render cluster template
        run: |
          mkdir -p "clusters/${CLUSTER_NAME}"
          cp -r clusters/_default-template/* "clusters/${CLUSTER_NAME}/"
          envsubst '${CLUSTER_NAME} ${CLUSTER_DOMAIN} ${CLUSTER_PUBLIC_IP} ${LETSENCRYPT_EMAIL} ${INGRESS_NGINX_ALLOWED_IPS}' \
            < "clusters/${CLUSTER_NAME}/cluster-sync.yaml" > "clusters/${CLUSTER_NAME}/cluster-sync.yaml.tmp"
          mv "clusters/${CLUSTER_NAME}/cluster-sync.yaml.tmp" "clusters/${CLUSTER_NAME}/cluster-sync.yaml"

      - name: Write flux-system Kustomization stub
        run: |
          cat > /tmp/flux-system-ks.yaml <<EOF
          apiVersion: kustomize.toolkit.fluxcd.io/v1
          kind: Kustomization
          metadata:
            name: flux-system
            namespace: flux-system
          spec:
            interval: 10m
            sourceRef:
              kind: GitRepository
              name: flux-system
            path: "./clusters/${CLUSTER_NAME}"
            prune: true
          EOF

      - name: Run kubeconform
        run: >-
          flux build kustomization flux-system
          --kustomization-file /tmp/flux-system-ks.yaml
          --path "clusters/${CLUSTER_NAME}/"
          --recursive
          --dry-run
          --local-sources "GitRepository/flux-system/flux-system=."
          | kubeconform
          -strict
          -ignore-missing-schemas
          -summary
          -verbose
          -schema-location default
          -schema-location "https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/{{.NormalizedKubernetesVersion}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          -schema-location "https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

  # ---------------------------------------------------------------------------
  # Stage: integration (live cluster — gitops-ai-bootstrapper template upgrade test)
  # Bootstraps from main, waits for Flux/Helm, merges this PR, pushes, verifies upgrade.
  # ---------------------------------------------------------------------------

  template-upgrade-test:
    name: Integration · Template upgrade (main → PR)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout template (full history for main + PR merge)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout gitops-ai-bootstrapper
        uses: actions/checkout@v4
        with:
          repository: GitOpsAI/gitops-ai-bootstrapper
          path: _gitops-ai-bootstrapper
          ref: feat/improve_template_sync

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: _gitops-ai-bootstrapper/package-lock.json

      - name: Install bootstrapper dependencies
        working-directory: _gitops-ai-bootstrapper
        run: npm ci --ignore-scripts

      - name: Run template upgrade test (k3d + Flux)
        working-directory: _gitops-ai-bootstrapper
        env:
          TEMPLATE_UPGRADE_TEST: "true"
          TEMPLATE_UPGRADE_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTIONS: "true"
          CI_PIPELINE_ID: ${{ github.run_id }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: PAT with repo scope if Flux cannot clone a fork PR with GITHUB_TOKEN.
          FLUX_GIT_TOKEN: ${{ secrets.FLUX_GIT_TOKEN }}
        run: npm run test:template-upgrade

      - name: Delete remote template-upgrade branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            --delete "ci-template-upgrade-${{ github.run_id }}" 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Stage: security
  # ---------------------------------------------------------------------------

  gitleaks:
    name: Security – gitleaks
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          apk add --no-cache curl
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin
      - name: Detect secrets
        run: gitleaks detect --source . --no-git --verbose
