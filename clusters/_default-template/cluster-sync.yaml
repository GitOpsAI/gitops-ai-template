apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-components
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./clusters/${CLUSTER_NAME}/components"
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      cluster_name: "${CLUSTER_NAME}"
      cluster_domain: "${CLUSTER_DOMAIN}"
      cluster_public_ip: "${CLUSTER_PUBLIC_IP}"
      letsencrypt_email: "${LETSENCRYPT_EMAIL}"
      ingress_nginx_allowed_ips: "${INGRESS_NGINX_ALLOWED_IPS}"
